name: Deploy Compliance Checklist API

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Compliance checklist/**'
      - 'Compliance_checklist/**'
      - '.github/workflows/deploy_compliance.yml'

jobs:
  deploy-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy compliance checklist files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.COMPLIANCE_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "Compliance checklist/*"
          target: "/home/ec2-user/"
          strip_components: 0

      - name: Deploy and restart compliance service
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.COMPLIANCE_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd "/home/ec2-user/Compliance checklist"
            
            # Install/update dependencies
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt
            
            # Create/update .env file with secrets (if needed)
            cat > .env <<EOF
            PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
            PINECONE_CLOUD=${{ secrets.PINECONE_CLOUD }}
            PINECONE_REGION=${{ secrets.PINECONE_REGION }}
            PINECONE_INDEX=${{ secrets.COMPLIANCE_PINECONE_INDEX }}
            PINECONE_NAMESPACE=${{ secrets.PINECONE_NAMESPACE }}
            EMBED_MODEL=${{ secrets.EMBED_MODEL }}
            CHAT_MODEL=${{ secrets.CHAT_MODEL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            EOF
            
            # Create/update systemd service file
            sudo tee /etc/systemd/system/compliance.service > /dev/null <<EOF
            [Unit]
            Description=Tariff Compliance Checklist API
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            WorkingDirectory=/home/ec2-user/Compliance checklist
            ExecStart=/usr/bin/python3 -m uvicorn src.api_server:app --host 0.0.0.0 --port 8001
            Restart=on-failure
            RestartSec=10
            StandardOutput=journal
            StandardError=journal
            SyslogIdentifier=compliance

            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Reload and restart service
            sudo systemctl daemon-reload
            sudo systemctl enable compliance
            sudo systemctl restart compliance
            
            # Check service status
            sudo systemctl status compliance --no-pager
