name: Run Tests

on:
  push:
    branches: [ main, develop, calculationtesting ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      docker:
        image: docker:dind
        options: --privileged
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run DutyService tests
      run: mvn test -Dtest=DutyServiceTest
      env:
        REDIS_URL: localhost
        REDIS_PORT: 6379
        REDIS_USERNAME: ""
        REDIS_PASSWORD: ""
        COGNITO_ISSUER: https://dummy-issuer.com
        COGNITO_TOKEN_SIGNING_KEY_URL: https://dummy-issuer.com/.well-known/jwks.json
      
    - name: Run AuditLogService tests  
      run: mvn test -Dtest=AuditLogServiceTest
      env:
        REDIS_URL: localhost
        REDIS_PORT: 6379
        REDIS_USERNAME: ""
        REDIS_PASSWORD: ""
        COGNITO_ISSUER: https://dummy-issuer.com
        COGNITO_TOKEN_SIGNING_KEY_URL: https://dummy-issuer.com/.well-known/jwks.json
      
    - name: Run all tests
      run: mvn clean test
      env:
        REDIS_URL: localhost
        REDIS_PORT: 6379
        REDIS_USERNAME: ""
        REDIS_PASSWORD: ""
        COGNITO_ISSUER: https://dummy-issuer.com
        COGNITO_TOKEN_SIGNING_KEY_URL: https://dummy-issuer.com/.well-known/jwks.json
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/
