#Profile flag
spring.profiles.active=local

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

# Auto-generate tables and updates schema automatically:
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries
spring.jpa.show-sql=true

# Show formatted SQL with parameters
# spring.jpa.properties.hibernate.show_sql=true # Does the same thing as spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_HIBERNATE_DIALECT}


# Show parameter binding (this shows the actual values)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Redis details
spring.data.redis.host=${REDIS_URL}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}

# OAuth2 Configuration
# Resource server only needs to know how to validate JWTs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_TOKEN_SIGNING_KEY_URL}

# AWS Cognito Configuration for Swagger OAuth2
aws.cognito.domain=${COGNITO_DOMAIN}
aws.cognito.region=${AWS_REGION}
aws.cognito.clientId=${COGNITO_CLIENT_ID}

# Debug logging
logging.level.org.springframework.security=DEBUG

# Server configuration
server.port=8080
# Increase max HTTP header size to handle large JWT tokens
server.max-http-request-header-size=65536
server.tomcat.max-http-request-header-size=65536

# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
# Pre-fill OAuth2 client_id (using PKCE, no client secret needed)
springdoc.swagger-ui.oauth.clientId=${COGNITO_CLIENT_ID}
# Auto-select the openid scope - use only openid for simplicity
springdoc.swagger-ui.oauth.scopes=openid
# Enable PKCE for secure authorization code flow without client secret
springdoc.swagger-ui.oauth.usePkceWithAuthorizationCodeGrant=true

# For custom OAuth2 redirect handling:
# Configure OAuth2 redirect URL - must match Cognito app client callback URL
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8080/oauth2-redirect.html
# Additional UI customizations
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
# Custom CSS/JS for popup handling
springdoc.swagger-ui.urls[0].name=API
springdoc.swagger-ui.urls[0].url=/v3/api-docs


# Allow circular references (if needed temporarily)
spring.main.allow-circular-references=true
spring.main.lazy-initialization=false

# Python scraper configuration - set to enable scraping services
app.scraping.enabled=true
app.python.script.path=scripts/python/web_scraper.py
app.python.executable=python3

# WITS/Data source login credentials
app.wits.username=${WITS_USERNAME}
app.wits.password=${WITS_PASSWORD}

# Enable scheduling
spring.task.scheduling.enabled=true

