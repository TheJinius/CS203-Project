#imports
spring.config.import=optional:application-test-local.properties

# A special Testcontainers JDBC URL that auto starts a PostgreSQL container:
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///testdb 

# The Hibernate dialect to use for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tells Spring to use the Testcontainers JDBC driver to interpret the special jdbc:tc: URL
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=postgres
spring.datasource.password=postgres

# Ensures Spring doesn’t replace container with H2
spring.test.database.replace=none 

# Hibernate will create the schema at the start of each test run and drop it at the end
spring.jpa.hibernate.ddl-auto=create-drop

# Log all the executed SQL statements to the console. Can be useful for debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.root=WARN

# Disable logging for cleaner test output
logging.level.org.springframework=WARN
logging.level.com.ubs.tariffapp=INFO

# Can disable if not needed for tests
app.data.load-on-startup=true

