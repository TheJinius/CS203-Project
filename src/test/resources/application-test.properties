#Redis details
spring.data.redis.host=${REDIS_URL}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}

# OAuth2 Configuration
# Resource server only needs to know how to validate JWTs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${COGNITO_TOKEN_SIGNING_KEY_URL}

# AWS Cognito Configuration for Swagger OAuth2
aws.cognito.domain=${COGNITO_DOMAIN}
aws.cognito.region=${AWS_REGION}
aws.cognito.clientId=${COGNITO_CLIENT_ID}

# Pre-fill OAuth2 client_id in Swagger UI (may not be needed for tests)
springdoc.swagger-ui.oauth.clientId=${COGNITO_CLIENT_ID}
# Auto-select the openid scope (may not be needed for tests)
springdoc.swagger-ui.oauth.scopes=openid
# Use PKCE for more secure OAuth2 flow
springdoc.swagger-ui.oauth.usePkceWithAuthorizationCodeGrant=true
# Use popup window for OAuth2 to avoid window.opener issues
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:8080/swagger-ui/oauth2-redirect.html

# Dummy values for testing for Spring context to load (not used in tests)
aws.cognito.domain=test-domain
aws.cognito.region=ap-southeast-1
aws.cognito.clientId=test-client-id

app.wits.username=test-username
app.wits.password=test-password